[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kai"
version = "0.1.0"
description = "SaaS-ready personal AI agent platform (KAI)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # The [asyncio] extra is required, not cosmetic. KAI drives SQLAlchemy only
    # through its async engine, which needs greenlet to suspend a coroutine at
    # an await. SQLAlchemy 2.0.x pulled greenlet in unconditionally; 2.1.x moved
    # it behind this extra. With a bare "sqlalchemy>=2.0.41" dependency a clean
    # install resolves 2.1.x, and the very first async engine creation raises
    # ImportError: "The SQLAlchemy asyncio module requires that the Python
    # 'greenlet' library is installed". A developer venv that already had 2.0.x
    # installed hid this, because only a from-scratch install reproduced it.
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "PyJWT>=2.10",
    "structlog>=25.2",
    "httpx>=0.28",
    "cryptography>=44",
    # Metrics exposition only. One dependency, no transitive tree, and it owns
    # exactly one job: render the counters/histograms this service records into
    # the Prometheus text format at /api/v1/metrics. Deliberately *not* the
    # OpenTelemetry SDK: that is a collector-and-exporter stack whose consumer
    # this single-service deployment does not have. KAI records its own spans
    # and ships them through the structured-log channel it already runs (see
    # src/kai/observability/tracing.py), which needs no extra dependency.
    "prometheus-client>=0.21",
    # Required, not optional: production refuses to start on the in-memory
    # rate-limit store, because a per-process counter is not a rate limit once
    # more than one replica is behind the load balancer. The async client is
    # imported lazily so a development run without Redis still works.
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.15",
]

# The revocation purge is a one-shot maintenance command, not a long-running
# process: the application never owns the schedule, so the operator's scheduler
# (cron / Kubernetes CronJob / systemd timer) invokes this and it exits. It
# takes a PostgreSQL transaction-scoped advisory lock, so overlapping replicas'
# runs collapse into one purge and the losers exit 0 without doing work.
[project.scripts]
kai-purge-revocations = "kai.maintenance.revocation_purge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# Resolution root for the checked package.
#
# KAI is an application, not a distributed library: it is never installed by
# anyone in order to consume its types, so it declares no ``py.typed`` marker.
# Without ``mypy_path``, ``packages = ["kai"]`` resolved the package from
# site-packages and mypy refused to check it at all ("cannot be type checked
# due to missing py.typed marker"), which meant the configured command type
# checked nothing. Pointing ``mypy_path`` at ``src`` makes the same command
# check the source tree that actually ships.
#
# The official command is therefore simply ``mypy``, and CI runs exactly that.
mypy_path = "src"
packages = ["kai"]

# Known gap: tests/ is deliberately outside this gate's scope.
#
# ``mypy src tests`` reports 196 findings, all in tests, none in src. They are
# real annotation debt - largely fixtures built as deliberately-invalid values
# to assert that runtime validation refuses them, plus 20 stale ``type: ignore``
# comments. Tightening them is a standalone task; folding it into a deployment
# round would mean editing the tests that guard fulfillment semantics.
#
# This narrows *type* checking only. Every test still runs in full under pytest
# in CI - see the test job. src/ is 100% covered by the type gate.
exclude = ['^tests/']