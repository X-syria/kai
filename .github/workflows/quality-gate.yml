name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.14"
  POSTGRES_USER: kai
  POSTGRES_PASSWORD: kai
  POSTGRES_DB: kai_test
  POSTGRES_PORT: 5432

jobs:
  tests:
    name: Python 3.14 - Lint, Type, DB Migrations, Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: kai
          POSTGRES_DB: kai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kai -d kai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://kai:kai@localhost:5432/kai_test
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (repository-wide)
        run: ruff check .

      - name: Mypy type check (src only)
        run: mypy

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
