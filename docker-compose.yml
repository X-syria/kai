# Reproducible local deployment stack for KAI.
#
# This is a development/CI-shaped stack, not production infrastructure. It exists
# so a clean checkout can be brought up the same way every time, with the same
# ordering guarantees a deployment needs: database healthy, then migrations
# applied exactly once, then the application serving.
#
#   docker compose up -d db
#   docker compose run --rm migrate      # one-shot, applies schema
#   docker compose up -d app
#   Invoke-RestMethod http://127.0.0.1:8000/api/v1/health
#
#   docker compose run --rm purge-revocations   # one-shot, scheduled externally
#
# Startup ordering is explicit rather than implied:
#   db       -> healthcheck (pg_isready)
#   migrate  -> runs to completion, is a one-shot job, exits 0
#   app      -> depends on migrate completing successfully
#
# Migrations are a separate one-shot service rather than a command the app runs
# on boot. An app that migrates itself takes schema locks on every replica
# start, which turns a rolling restart into a migration race. Here exactly one
# job migrates, and the app only ever reads the schema.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kai}
      POSTGRES_DB: ${POSTGRES_DB:-kai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kai} -d ${POSTGRES_DB:-kai}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Shared rate-limit counters. The in-memory fallback counts per process, so
  # scaling the app past one replica without this service silently multiplies
  # the effective auth rate limit by the replica count. Production refuses to
  # start unless the Redis backend is selected.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema application. Never scaled; exits when the schema is current.
  #
  # RATE_LIMIT_BACKEND and REDIS_URL are present even though this job serves no
  # HTTP. Settings validation is process-wide and fails closed in production
  # unless the Redis backend is selected, so a one-shot job that omits them
  # cannot start at all under ENVIRONMENT=production. Supplying the same values
  # the app uses keeps that check intact rather than weakening it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    # The defaults below are the shipped production posture: ENVIRONMENT is
    # production, so a `.env` that only supplies secrets still boots a stack
    # with every control enforced. Each default is one the production validators
    # accept, because a compose file whose own defaults cannot start is a file
    # that fails on the operator's first `docker compose up`.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
      PLANNER_MODEL_URL: ${PLANNER_MODEL_URL:-}
      PLANNER_MODEL_API_KEY: ${PLANNER_MODEL_API_KEY:-}
      # "redis", not "auto". The two are behaviourally identical here -- the
      # limiter resolves "auto" to redis whenever REDIS_URL is set, and the line
      # below always sets it -- but production validation reads the literal
      # string and refuses anything but "redis". A default that the validator
      # rejects means `ENVIRONMENT=production` alone refuses to boot.
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PATH: ${METRICS_PATH:-/api/v1/metrics}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_ACCEPT_INBOUND: ${TRACING_ACCEPT_INBOUND:-false}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # One-shot expired-revocation purge. The same image and the same code as the
  # app, a different entrypoint.
  #
  # It is deliberately NOT a long-running service here. Compose has no
  # scheduler, and a loop here would tie the schedule to this stack rather than
  # to the operator's cron / systemd timer / Kubernetes CronJob. Run it on
  # demand with:
  #
  #   docker compose run --rm purge-revocations
  #
  # and schedule that command every 15 minutes UTC in whatever already runs
  # scheduled jobs for the environment. The shipped schedule is
  # deploy/scheduler/kai.cron, which calls deploy/scheduler/run-purge-revocations.sh.
  # Overlapping invocations are safe: the command takes a transaction-scoped
  # PostgreSQL advisory lock, so all but one exit 0 having done nothing.
  #
  # RATE_LIMIT_BACKEND and REDIS_URL are here for the same reason they are on
  # migrate: process-wide fail-closed validation would otherwise stop this job
  # from starting under ENVIRONMENT=production, and a purge that cannot run in
  # production is not a purge.
  purge-revocations:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["kai-purge-revocations"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot alert-outbox dispatcher. The same image and code as the app, a
  # different entrypoint, for the same reason as the purge above: the application
  # must not own a schedule, and a task transition must never wait on a socket.
  #
  #   docker compose run --rm dispatch-alerts
  #
  # and schedule that command every minute in whatever already runs scheduled
  # jobs. The shipped schedule is deploy/scheduler/kai.cron, which calls
  # deploy/scheduler/run-dispatch-alerts.sh.
  #
  # Alerting is armed by the SAME two variables the app validates
  # (ALERTING_ENABLED and ALERT_WEBHOOK_URL). When they are unset the dispatcher
  # claims nothing: queued alerts stay PENDING and deliver once a destination
  # exists. It does not discard them, because the queue is the durable record
  # that the notification is owed.
  #
  # RATE_LIMIT_BACKEND and REDIS_URL are here for the same reason as on migrate:
  # process-wide fail-closed validation would otherwise stop this job from
  # starting under ENVIRONMENT=production.
  dispatch-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["kai-dispatch-alerts"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALERTING_ENABLED: ${ALERTING_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_TIMEOUT_SECONDS: ${ALERT_TIMEOUT_SECONDS:-5.0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  kai_pgdata:
