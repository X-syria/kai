# Reproducible local deployment stack for KAI.
#
# This is a development/CI-shaped stack, not production infrastructure. It exists
# so a clean checkout can be brought up the same way every time, with the same
# ordering guarantees a deployment needs: database healthy, then migrations
# applied exactly once, then the application serving.
#
#   docker compose up -d db
#   docker compose run --rm migrate      # one-shot, applies schema
#   docker compose up -d app
#   Invoke-RestMethod http://127.0.0.1:8000/api/v1/health
#
#   docker compose run --rm purge-revocations   # one-shot, scheduled externally
#
# Startup ordering is explicit rather than implied:
#   db       -> healthcheck (pg_isready)
#   migrate  -> runs to completion, is a one-shot job, exits 0
#   app      -> depends on migrate completing successfully
#
# Migrations are a separate one-shot service rather than a command the app runs
# on boot. An app that migrates itself takes schema locks on every replica
# start, which turns a rolling restart into a migration race. Here exactly one
# job migrates, and the app only ever reads the schema.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kai}
      POSTGRES_DB: ${POSTGRES_DB:-kai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kai} -d ${POSTGRES_DB:-kai}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Shared rate-limit counters. The in-memory fallback counts per process, so
  # scaling the app past one replica without this service silently multiplies
  # the effective auth rate limit by the replica count. Production refuses to
  # start unless the Redis backend is selected.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema application. Never scaled; exits when the schema is current.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
      PLANNER_MODEL_URL: ${PLANNER_MODEL_URL:-}
      PLANNER_MODEL_API_KEY: ${PLANNER_MODEL_API_KEY:-}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-auto}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PATH: ${METRICS_PATH:-/api/v1/metrics}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_ACCEPT_INBOUND: ${TRACING_ACCEPT_INBOUND:-false}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1.0}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # One-shot expired-revocation purge. The same image and the same code as the
  # app, a different entrypoint.
  #
  # It is deliberately NOT a long-running service here. Compose has no
  # scheduler, and a loop here would tie the schedule to this stack rather than
  # to the operator's cron / systemd timer / Kubernetes CronJob. Run it on
  # demand with:
  #
  #   docker compose run --rm purge-revocations
  #
  # and schedule that command every 15 minutes UTC in whatever already runs
  # scheduled jobs for the environment. Overlapping invocations are safe: the
  # command takes a transaction-scoped PostgreSQL advisory lock, so all but one
  # exit 0 having done nothing.
  purge-revocations:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["kai-purge-revocations"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kai}:${POSTGRES_PASSWORD:-kai}@db:5432/${POSTGRES_DB:-kai}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CREDS_ENCRYPTION_SECRET: ${GOOGLE_CREDS_ENCRYPTION_SECRET:-change-me-google-token-encryption}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  kai_pgdata:
